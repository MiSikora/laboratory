[versions]
android = "8.12.0"
coroutines = "1.10.2"
kotest = "5.9.1"
kotlin = "2.2.0"
hyperion = "0.9.38"
detekt = "1.23.8"
ktlint = "1.2.1"

jvmTarget = "11"
minSdk = "21"
compileSdk = "36"
targetSdk = "36"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutinesAndroid = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinPoet = { group = "com.squareup", name = "kotlinpoet", version = "2.2.0" }
androidx-dataStore = { group = "androidx.datastore", name = "datastore-core", version = "1.1.7" }
androidx-appCompat = { group = "androidx.appcompat", name = "appcompat", version = "1.7.1" }
androidx-viewModelKtx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version = "2.9.2" }
androidx-fragmentKtx = { group = "androidx.fragment", name = "fragment-ktx", version = "1.8.8" }
androidx-viewPager2 = { group = "androidx.viewpager2", name = "viewpager2", version = "1.1.0" }
androidx-recyclerView = { group = "androidx.recyclerview", name = "recyclerview", version = "1.4.0" }
android-gradle-api = { group = "com.android.tools.build", name = "gradle-api", version.ref = "android" }
android-material = { group = "com.google.android.material", name = "material", version = "1.12.0" }
hyperion-core = { group = "com.willowtreeapps.hyperion", name = "hyperion-core", version.ref = "hyperion" }
hyperion-plugin = { group = "com.willowtreeapps.hyperion", name = "hyperion-plugin", version.ref = "hyperion" }
autoServiceKsp = { group = "dev.zacsweers.autoservice", name = "auto-service-ksp", version = "1.2.0" }

kotlinx-coroutinesTest = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotest-runner-junit5 = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
kotest-property = { group = "io.kotest", name = "kotest-property-jvm", version.ref = "kotest" }
turbine = { group = "app.cash.turbine", name = "turbine", version = "1.2.1" }
androidx-test-coreKtx = { group = "androidx.test", name = "core-ktx", version = "1.7.0" }
androidx-test-orchestrator = { group = "androidx.test", name = "orchestrator", version = "1.4.2" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.5.2" }
androidx-testExt-junitKtx = { group = "androidx.test.ext", name = "junit-ktx", version = "1.1.5" }

android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "android" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "android" }
android-application = { id = "com.android.application", version.ref = "android" }
ksp = { id = "com.google.devtools.ksp", version = "2.2.0-2.0.2" }
wire = { id = "com.squareup.wire", version = "5.3.5" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version = "5.6.7" }
mavenPublish = { id = "com.vanniktech.maven.publish", version = "0.34.0" }
spotless = { id = "com.diffplug.spotless", version = "7.2.1" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kotlinx-binaryCompatibilityValidator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version = "0.18.1" }
dokka = { id = "org.jetbrains.dokka", version = "2.0.0" }
