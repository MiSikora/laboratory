build:
  maxIssues: 0

complexity:
  TooManyFunctions:
    active: false

naming:
  ObjectPropertyNaming:
    active: true
    constantPattern: '^[a-zA-Z]+(?:[A-Z][a-z]+)*$'
    propertyPattern: '^[a-zA-Z]+(?:[A-Z][a-z]+)*$'
    privatePropertyPattern: '^[a-z]+(?:[A-Z][a-z]+)*$'
  TopLevelPropertyNaming:
    active: true
    constantPattern: '^[a-zA-Z]+(?:[A-Z][a-z]+)*$'
    propertyPattern: '^[a-zA-Z]+(?:[A-Z][a-z]+)*$'
    privatePropertyPattern: '^[a-z]+(?:[A-Z][a-z]+)*$'

style:
  ForbiddenComment:
    active: false
